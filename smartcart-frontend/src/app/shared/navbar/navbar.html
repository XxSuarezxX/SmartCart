<nav>
  <div class="nav-left">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <path d="M16 10a4 4 0 0 1-8 0" />
      </svg>
      SmartCart
    </div>
    <ul class="nav-links">
      <li routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Inicio</li>
      <li routerLink="/catalogo" routerLinkActive="active">Catálogo</li>
      <li routerLink="/recomendados" routerLinkActive="active">Recomendados</li>
      <li *ngIf="isLoggedIn && !isAdmin" routerLink="/mi-cuenta" routerLinkActive="active">Mis Compras</li>
    </ul>
  </div>

  <div class="nav-right">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" placeholder="Buscar productos..." [(ngModel)]="busqueda" (keyup.enter)="buscar()" />
    </div>


    <div class="nav-icons">
      <div class="icon-btn" *ngIf="isLoggedIn && !isAdmin" (click)="irAFavoritos()" style="cursor:pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
        <span class="badge" *ngIf="likesCount > 0">{{ likesCount }}</span>
      </div>

      <div class="icon-btn" *ngIf="isLoggedIn && !isAdmin" routerLink="/carrito" style="cursor:pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span class="badge">{{ carritoCount }}</span>
      </div>

      <div class="account" (click)="toggleMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
        <span class="account-label" *ngIf="isLoggedIn">{{ username }}</span>
        <span class="account-label" *ngIf="!isLoggedIn">Iniciar sesión</span>

        <div class="dropdown" *ngIf="menuAbierto">
          <ng-container *ngIf="!isLoggedIn">
            <a routerLink="/login">Iniciar sesión</a>
            <a routerLink="/registro">Crear cuenta</a>
          </ng-container>
          <ng-container *ngIf="isLoggedIn">
            <ng-container *ngIf="!isAdmin">
              <a routerLink="/mi-cuenta">Mi perfil</a>
              <a routerLink="/mi-cuenta">Mis compras</a>
            </ng-container>
            <ng-container *ngIf="isAdmin">
              <a routerLink="/admin">Panel Admin</a>
            </ng-container>
            <div class="dropdown-divider"></div>
            <a class="logout" (click)="logout()">Cerrar sesión</a>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</nav>
