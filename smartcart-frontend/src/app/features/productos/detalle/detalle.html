<div class="detalle-page">

  <div class="loading" *ngIf="cargando">
    <div class="spinner"></div>
  </div>

  <div class="detalle-container" *ngIf="!cargando && producto">

    <button class="btn-volver" (click)="volver()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7" />
      </svg>
      Volver
    </button>

    <div class="detalle-grid">

      <div class="detalle-imagen">
        <div class="carrusel">
          <button class="carrusel-btn prev" (click)="imagenAnterior()" *ngIf="imagenes.length > 1">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>

          <img [src]="imagenes[imagenActiva]" [alt]="producto.nombre"
            onerror="this.src='https://placehold.co/600x700?text=Sin+imagen'">

          <button class="carrusel-btn next" (click)="imagenSiguiente()" *ngIf="imagenes.length > 1">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>

          <button class="like-btn" (click)="toggleLike()" [class.liked]="liked">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              [attr.fill]="liked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
          </button>
        </div>

        <!-- Miniaturas -->
        <div class="miniaturas" *ngIf="imagenes.length > 1">
          <img *ngFor="let img of imagenes; let i = index" [src]="img" [alt]="producto.nombre + ' ' + (i+1)"
            [class.activa]="imagenActiva === i" (click)="seleccionarImagen(i)"
            onerror="this.src='https://placehold.co/80x80?text=IMG'">
        </div>
      </div>

      <div class="detalle-info">
        <span class="categoria-badge">{{ producto.categoria?.nombre }}</span>
        <h1>{{ producto.nombre }}</h1>
        <p class="precio">{{ producto.precio | precio }}</p>
        <p class="descripcion">{{ producto.descripcion }}</p>

        <!-- Colores -->
        <div class="opciones-grupo" *ngIf="colores.length > 0">
          <p class="opciones-label">Color: <span>{{ colorSeleccionado }}</span></p>
          <div class="colores">
            <button *ngFor="let color of colores" class="color-btn" [class.active]="colorSeleccionado === color"
              [style.background]="getColorHex(color)" (click)="seleccionarColor(color)" [title]="color">
            </button>
          </div>
        </div>

        <!-- Tallas -->
        <div class="opciones-grupo" *ngIf="tallas.length > 0">
          <p class="opciones-label">Talla: <span>{{ tallaSeleccionada || 'Selecciona una talla' }}</span></p>
          <div class="tallas">
            <button *ngFor="let talla of tallas" class="talla-btn" [class.active]="tallaSeleccionada === talla"
              (click)="seleccionarTalla(talla)">
              {{ talla }}
            </button>
          </div>
        </div>

        <div class="stock-info">
          <span *ngIf="producto.stock > 0">✓ {{ producto.stock }} unidades disponibles</span>
          <span class="sin-stock" *ngIf="producto.stock === 0">Sin stock</span>
        </div>

        <button class="btn-comprar" (click)="comprar()" [disabled]="producto.stock === 0">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          {{ producto.stock === 0 ? 'Sin stock' : 'Comprar ahora' }}
        </button>
      </div>
    </div>
  </div>
</div>
