<div class="login-page">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <main class="login-card">
    <!-- Panel izquierdo -->
    <aside class="login-aside">
      <div class="aside-overlay-color"></div>
      <div class="aside-overlay-fade"></div>
      <img
        src="https://hips.hearstapps.com/hmg-prod/images/model-presents-a-creation-for-the-dries-van-notens-menswear-news-photo-1760427997.pjpeg?crop=0.667xw:1.00xh;0.135xw,0&resize=640:*"
        alt="" class="aside-image" />

      <div class="aside-top">
        <div class="aside-badge">
          <div class="aside-dot"></div>
        </div>
      </div>

      <div class="aside-bottom">
        <p class="aside-quote">
          "Descubre tu estilo, exprésate con nuestra moda"
        </p>
        <div class="aside-author">
          <div class="aside-line"></div>
          <p>SmartCart</p>
        </div>
      </div>
    </aside>

    <!-- Formulario -->
    <section class="login-form-panel">
      <div class="top-divider"></div>
      <a routerLink="/" class="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Volver
      </a>
      
      <header class="form-header">
        <h1>Bienvenido a SmartCart</h1>
        <p>Introduce tus credenciales e ingresa para comprar las mejores prendas</p>
      </header>

      <form class="login-form" (ngSubmit)="onLogin()">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" />
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Contraseña</label>
            <a href="#" class="link-muted">Olvide la contraseña</a>
          </div>
          <input id="password" type="password" placeholder="••••••••••••" class="password-input" [(ngModel)]="password"
            name="password" />
        </div>

        <p class="error-msg" *ngIf="error">{{ error }}</p>

        <div class="actions">
          <button type="submit" class="btn-primary">Iniciar sesión</button>
          <div class="divider">
            <div class="divider-line"></div>
          </div>
        </div>
      </form>

      <footer class="form-footer">
        <p>
          ¿Aún no tienes cuenta?
          <a routerLink="/registro">Regístrate aquí</a>
        </p>
      </footer>
    </section>
  </main>
</div>
