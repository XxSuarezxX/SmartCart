<div class="login-page">
  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <main class="login-card">
    <!-- Panel izquierdo -->
    <aside class="login-aside">
      <div class="aside-overlay-color"></div>
      <div class="aside-overlay-fade"></div>
      <img
        src="https://hips.hearstapps.com/hmg-prod/images/model-presents-a-creation-for-the-dries-van-notens-menswear-news-photo-1760427997.pjpeg?crop=0.667xw:1.00xh;0.135xw,0&resize=640:*"
        alt="" class="aside-image" />

      <div class="aside-top">
        <div class="aside-badge">
          <div class="aside-dot"></div>
        </div>
      </div>

      <div class="aside-bottom">
        <p class="aside-quote">
          "Descubre tu estilo, exprésate con nuestra moda"
        </p>
        <div class="aside-author">
          <div class="aside-line"></div>
          <p>SmartCart</p>
        </div>
      </div>
    </aside>

    <!-- Formulario -->
    <section class="login-form-panel">
      <div class="top-divider"></div>
      <a routerLink="/" class="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7" />
        </svg>
        Volver
      </a>

      <header class="form-header">
        <h1>Bienvenido a SmartCart</h1>
        <p>Introduce tus credenciales e ingresa para comprar las mejores prendas</p>
      </header>

      <form class="login-form" (ngSubmit)="onLogin()">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" />
        </div>

        <div class="password-wrapper">
          <label for="email">Contraseña</label>
          <input [type]="mostrarPassword ? 'text' : 'password'" placeholder="••••••••••••" class="password-input"
            [(ngModel)]="password" name="password" />
          <button type="button" class="toggle-password" (click)="mostrarPassword = !mostrarPassword">
            <svg *ngIf="!mostrarPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="mostrarPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <p class="error-msg" *ngIf="error">{{ error }}</p>

        <div class="actions">
          <button type="submit" class="btn-primary">Iniciar sesión</button>
          <div class="divider">
            <div class="divider-line"></div>
          </div>
        </div>
      </form>

      <footer class="form-footer">
        <p>
          ¿Aún no tienes cuenta?
          <a routerLink="/registro">Regístrate aquí</a>
        </p>
      </footer>
    </section>
  </main>
</div>
