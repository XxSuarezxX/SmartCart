name: CI

# Se ejecuta en cada push y en cada Pull Request hacia main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permite cancelar ejecuciones anteriores del mismo branch/PR si llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) PRUEBAS UNITARIAS  (JUnit + Mockito) + cobertura JaCoCo
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 'verify' compila, ejecuta los tests (H2 en memoria, perfil 'test'),
      # genera el reporte JaCoCo y empaqueta el .jar de la aplicación.
      - name: Build, test y cobertura
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Publica el .jar para reutilizarlo en los jobs de Selenium y JMeter
      # (evita recompilar la aplicación tres veces).
      - name: Subir artefacto de la aplicación
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Subir resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Subir reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) ANALISIS DE CALIDAD  (SonarQube / SonarCloud)
  # ---------------------------------------------------------------------------
  # Requiere dos secretos en el repositorio (Settings > Secrets and variables > Actions):
  #   - SONAR_TOKEN     : token generado en tu instancia de SonarQube / SonarCloud
  #   - SONAR_HOST_URL  : URL del servidor (ej. https://sonarcloud.io)
  # Para SonarCloud, define ademas la variable SONAR_ORGANIZATION.
  # Si SONAR_TOKEN no esta configurado, el job se omite sin fallar.
  sonarqube:
    name: Analisis SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para el "blame" y el new code
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Cachea los paquetes del scanner de Sonar
      - name: Cache de paquetes SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build + analisis SonarQube
        if: env.SONAR_TOKEN != ''
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            ${SONAR_ORGANIZATION:+-Dsonar.organization=$SONAR_ORGANIZATION}

      - name: Aviso si SonarQube no esta configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no esta configurado. Se omite el analisis de SonarQube. Define los secretos SONAR_TOKEN y SONAR_HOST_URL para activarlo."

  # ---------------------------------------------------------------------------
  # 3) PRUEBAS E2E  (Selenium WebDriver sobre la app desplegada)
  # ---------------------------------------------------------------------------
  selenium:
    name: Pruebas E2E (Selenium)
    runs-on: ubuntu-latest
    needs: unit-tests

    # Base de datos PostgreSQL para que la aplicacion arranque de forma realista
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar el .jar de la aplicacion
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      # Arranca la aplicacion en segundo plano apuntando al PostgreSQL del servicio
      - name: Arrancar la aplicacion
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartcart
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          JAR=$(find target -name '*.jar' -not -name '*.original' | head -n 1)
          # IMPORTANTE: copiamos el jar FUERA de target/ y arrancamos desde la copia.
          # 'mvn verify' (paso de JMeter) ejecuta spring-boot:repackage y REESCRIBE
          # target/*.jar; si la app corre desde ese mismo archivo, la carga lazy de
          # clases se corrompe (NoClassDefFoundError: ch/qos/logback/.../ThrowableProxy)
          # y los hilos de Tomcat mueren -> 100% de timeouts en JMeter.
          cp "$JAR" "$RUNNER_TEMP/smartcart-app.jar"
          echo "Iniciando $RUNNER_TEMP/smartcart-app.jar (copia de $JAR)"
          nohup java -jar "$RUNNER_TEMP/smartcart-app.jar" > app.log 2>&1 &
          echo $! > app.pid

      - name: Esperar a que la aplicacion responda
        run: |
          echo "Esperando a http://127.0.0.1:8080/productos ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/productos || true)
            if [ "$code" = "200" ]; then
              echo "Aplicacion lista (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "La aplicacion no respondio a tiempo. Ultimos logs:"
          tail -n 100 app.log
          exit 1

      # Chrome ya viene preinstalado en ubuntu-latest; Selenium Manager (Selenium 4)
      # descarga el chromedriver compatible automaticamente.
      - name: Ejecutar pruebas E2E con Selenium
        run: |
          ./mvnw --batch-mode --no-transfer-progress test \
            -Dgroups=e2e -DexcludedGroups= \
            -De2e.base-url=http://127.0.0.1:8080

      - name: Detener la aplicacion
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi

      - name: Subir logs de la aplicacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-app-log
          path: app.log
          if-no-files-found: ignore

      - name: Subir resultados de los tests E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4) PRUEBAS DE CARGA  (Apache JMeter)
  # ---------------------------------------------------------------------------
  jmeter:
    name: Pruebas de carga (JMeter)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartcart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartcart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Descargar el .jar de la aplicacion
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Arrancar la aplicacion
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartcart
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          JAR=$(find target -name '*.jar' -not -name '*.original' | head -n 1)
          # IMPORTANTE: copiamos el jar FUERA de target/ y arrancamos desde la copia.
          # 'mvn verify' (paso de JMeter) ejecuta spring-boot:repackage y REESCRIBE
          # target/*.jar; si la app corre desde ese mismo archivo, la carga lazy de
          # clases se corrompe (NoClassDefFoundError: ch/qos/logback/.../ThrowableProxy)
          # y los hilos de Tomcat mueren -> 100% de timeouts en JMeter.
          cp "$JAR" "$RUNNER_TEMP/smartcart-app.jar"
          echo "Iniciando $RUNNER_TEMP/smartcart-app.jar (copia de $JAR)"
          nohup java -jar "$RUNNER_TEMP/smartcart-app.jar" > app.log 2>&1 &
          echo $! > app.pid

      - name: Esperar a que la aplicacion responda
        run: |
          echo "Esperando a http://127.0.0.1:8080/productos ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/productos || true)
            if [ "$code" = "200" ]; then
              echo "Aplicacion lista (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "La aplicacion no respondio a tiempo. Ultimos logs:"
          tail -n 100 app.log
          exit 1

      # Diagnostico: confirma que la app sigue arriba justo antes de la carga
      # y muestra el final del log (util si JMeter no logra conectar).
      - name: Verificar estado de la aplicacion
        run: |
          echo "Health-check previo a JMeter:"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8080/productos || true
          echo "--- ultimas lineas de app.log ---"
          tail -n 30 app.log || true

      # El jmeter-maven-plugin descarga JMeter, ejecuta src/test/jmeter/*.jmx
      # y comprueba el porcentaje de error (falla si supera el umbral del pom).
      # Los goals (configure -> jmeter -> results) van enlazados al ciclo de vida,
      # por eso se lanza con 'verify'. -DskipTests salta solo las unitarias: el
      # plugin de JMeter las ejecuta igual gracias a <skipTests>false</skipTests>.
      - name: Ejecutar prueba de carga con JMeter
        run: ./mvnw --batch-mode --no-transfer-progress -Pjmeter -DskipTests verify

      - name: Detener la aplicacion
        if: always()
        run: |
          if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi

      - name: Subir resultados y reporte de JMeter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: |
            target/jmeter/results/
            target/jmeter/reports/
          if-no-files-found: ignore

      - name: Subir logs de la aplicacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-app-log
          path: app.log
          if-no-files-found: ignore
