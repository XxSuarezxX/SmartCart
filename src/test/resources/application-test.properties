# Perfil 'test': base de datos H2 en memoria.
# Permite que los tests con @SpringBootTest levanten el contexto de Spring
# sin necesidad de un PostgreSQL real corriendo (ideal para CI / SonarQube).

# H2 en memoria, en modo de compatibilidad con PostgreSQL
spring.datasource.url=jdbc:h2:mem:smartcart;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea el esquema desde cero para cada ejecucion de tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
