spring.application.name=ecommerce

# config base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/smartcart
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
# 'update' mantiene los datos y solo aplica cambios en la estructura
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Formatear el SQL en consola para lectura facil
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=smartcart2025secretkeyparajwtquedebeteneral256bitsminimo123456

# Configuracion SMTP para envio de recibos por correo
# Por defecto usa Gmail. Define MAIL_USERNAME y MAIL_PASSWORD como variables
# de entorno (en Gmail se debe usar una "App Password", no la clave normal).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente que aparece en el correo del recibo
smartcart.mail.from=${MAIL_FROM:no-reply@smartcart.com}
smartcart.mail.nombre-tienda=SmartCart
